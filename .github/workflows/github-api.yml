name: PR MONITOR

on:
  workflow_dispatch:
  schedule:
    # Run hourly, away from the busier start of the hour on GitHub Actions.
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: github-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Run the GitHub API test
        run: npx playwright test tests/integration/github.spec.ts
        env:
          GITHUB_API_TOKEN: ${{ github.token }}

      - name: Save the HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 7
